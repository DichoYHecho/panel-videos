name: Prueba de voces (V2)

# Solo a mano. No toca Airtable ni publica nada: guarda los MP3 en la rama «pruebas-voz».
on:
  workflow_dispatch:
    inputs:
      voces_m:
        description: "Voces de Gemini para el autor (separadas por comas)"
        default: "Koda,Ludo,Mako,Charon,Orus"
      voces_f:
        description: "Voces de Gemini para la autora (separadas por comas)"
        default: "Kira,Kore,Sulafat,Aoede"
      estilo:
        description: "Estilo de la voz (vacío = narrador de documental tranquilo)"
        default: ""

permissions:
  contents: write

jobs:
  voces:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y librerías
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt

      - name: Descargar las voces de ahora (Piper davefx y sharvard)
        run: |
          mkdir -p modelos && cd modelos
          curl -sSfL -o voz.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_ES-davefx-medium.tar.bz2
          echo "a3f6beb54a9cb893279f72978a22f807a4d9fc9c7848157b524d5cc7b7f58b22  voz.tar.bz2" | sha256sum -c -
          tar xjf voz.tar.bz2 && rm voz.tar.bz2
          curl -sSfL -o voz_f.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_ES-sharvard-medium.tar.bz2
          echo "b30a7a83df0518f0ee1c7039506648cade99f1f9b498fc49ed2ced2e2536bb5a  voz_f.tar.bz2" | sha256sum -c -
          tar xjf voz_f.tar.bz2 && rm voz_f.tar.bz2

      - name: Generar las voces
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOCES_M: ${{ inputs.voces_m }}
          VOCES_F: ${{ inputs.voces_f }}
          ESTILO: ${{ inputs.estilo }}
        run: python videos/prueba_voces.py

      - name: Guardar los MP3 en la rama pruebas-voz
        run: |
          mkdir -p /tmp/salida && cp pruebas_voz/*.mp3 /tmp/salida/
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pruebas-voz-nueva
          git rm -rq --cached . && git clean -fdq -e modelos
          cp /tmp/salida/*.mp3 .
          git add *.mp3
          git commit -qm "Prueba de voces ${{ github.run_number }}"
          git push -qf origin HEAD:pruebas-voz
          ls -1 *.mp3

name: Prueba del formato quiz (sin publicar)

# Se lanza al cambiar .github/prueba_quiz.txt en la rama formato-quiz. Solo lee Airtable: no escribe ni publica.
on:
  push:
    branches: [formato-quiz]
    paths: [".github/prueba_quiz.txt"]

concurrency:
  group: videos   # nunca a la vez que el montaje diario (comparten el cupo de Gemini)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg

      - name: Instalar librerías de Python
        run: pip install -r requirements.txt

      - name: Instalar Remotion y su navegador
        working-directory: remotion
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Caché del modelo de Whisper «medium» (tiempos de cada palabra)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1

      - name: Recuperar las voces ya hechas
        uses: actions/cache/restore@v4
        with:
          path: cache/voces
          key: voces-${{ github.run_id }}
          restore-keys: voces-

      - name: Montar los Shorts en formato quiz (solo lee Airtable)
        run: python videos/prueba_quiz.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-quiz
          path: salida_quiz/
          retention-days: 3

      - name: Guardar las voces (para no gastar cupo si se repite)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/voces
          key: voces-${{ github.run_id }}

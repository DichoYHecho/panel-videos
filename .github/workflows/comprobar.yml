name: Comprobar publicaciones (M2)

on:
  schedule:
    # GitHub usa la hora UTC. Unos 40 minutos después de cada publicación (Madrid: 12:00 y 17:00).
    - cron: "40 16 * * *"     # todos los días: 17:40 en invierno (18:40 en verano)
    - cron: "40 11 * * 0,6"   # sábados y domingos: 12:40 en invierno (13:40 en verano)
  workflow_dispatch:
    inputs:
      dias:
        description: "Cuántos días hacia atrás mirar en Buffer"
        required: true
        default: "4"
      solo_mirar:
        description: "Comentarios de YouTube: solo enseñar qué se publicaría, sin publicar nada"
        type: boolean
        default: false

concurrency:
  group: comprobar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      DIAS: ${{ inputs.dias || '4' }}
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar en Buffer las publicaciones de los últimos días
        run: python3 videos/comprobar.py

      - name: Publicar el comentario en YouTube (tarea 6.16)
        # Si falla, la siguiente ejecución lo reintenta. Sin los secrets de YouTube, no hace nada.
        if: always()
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOLO_MIRAR: ${{ inputs.solo_mirar && '1' || '0' }}
        run: python3 videos/comentar_youtube.py

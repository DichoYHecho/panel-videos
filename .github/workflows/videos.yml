name: Vídeos de las citas

on:
  schedule:
    # GitHub usa la hora UTC. En horario de invierno de Madrid (desde el 25 de octubre):
    - cron: "30 2 * * 0"   # domingos a las 03:30, después del lote del escenario 1 (02:00)
    - cron: "0 12 * * *"   # todos los días a las 13:00: repesca (créditos corregidos, fallos, voz)
    - cron: "0 3 1 * *"    # el día 1 de cada mes a las 04:00: limpieza de vídeos ya publicados
  workflow_dispatch:
    inputs:
      limite:
        description: "Cuántos vídeos crear como máximo"
        required: true
        default: "2"
      rehacer:
        description: "Rehacer también los vídeos con la voz de antes (después de los que no tienen vídeo)"
        type: boolean
        default: true
      limpiar:
        description: "Hacer también la limpieza de vídeos ya publicados"
        type: boolean
        default: false
      comentarios:
        description: "Cuántos comentarios para YouTube escribir como máximo (0 = ninguno)"
        required: true
        default: "20"
      solo_mirar:
        description: "Comentarios: solo enseñarlos en el resumen, sin guardarlos en Airtable"
        type: boolean
        default: false

concurrency:
  group: videos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REHACER: ${{ (github.event_name != 'workflow_dispatch' || inputs.rehacer) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      - name: Limpieza mensual de vídeos ya publicados
        if: github.event.schedule == '0 3 1 * *' || inputs.limpiar
        run: python3 videos/limpiar.py

      - name: Comentarios para YouTube (tarea 6.16)
        # Si falla, no para los vídeos: la siguiente ejecución lo reintenta.
        continue-on-error: true
        env:
          LIMITE_COMENTARIOS: ${{ inputs.comentarios || '20' }}
          SOLO_MIRAR: ${{ inputs.solo_mirar && '1' || '0' }}
        run: python3 videos/comentarios.py

      - name: ¿Hay publicaciones sin vídeo?
        id: mirar
        run: python3 videos/pendientes.py

      - uses: actions/setup-python@v6
        if: steps.mirar.outputs.hay == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y la fuente Inter
        if: steps.mirar.outputs.hay == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-inter

      - name: Instalar librerías de Python
        if: steps.mirar.outputs.hay == 'true'
        run: pip install -r requirements.txt

      - name: Caché del modelo de Whisper (subtítulos)
        if: steps.mirar.outputs.hay == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Recuperar las voces ya hechas
        if: steps.mirar.outputs.hay == 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache/voces
          key: voces-${{ github.run_id }}
          restore-keys: voces-

      - name: Crear los vídeos y subirlos a Airtable
        if: steps.mirar.outputs.hay == 'true'
        env:
          LIMITE: ${{ inputs.limite || '12' }}
        run: python videos/generar.py

      - name: Guardar las voces
        if: always() && steps.mirar.outputs.hay == 'true'
        uses: actions/cache/save@v4
        with:
          path: cache/voces
          key: voces-${{ github.run_id }}

name: Vídeos de las citas

on:
  schedule:
    # GitHub usa la hora UTC. En horario de invierno de Madrid (desde el 25 de octubre):
    - cron: "30 2 * * 0"   # domingos a las 03:30, después del lote del escenario 1 (02:00)
    - cron: "0 12 * * *"   # todos los días a las 13:00: repesca (créditos corregidos, fallos)
    - cron: "0 3 1 * *"    # el día 1 de cada mes a las 04:00: limpieza de vídeos ya publicados
  workflow_dispatch:
    inputs:
      limite:
        description: "Cuántos vídeos crear como máximo"
        required: true
        default: "2"
      limpiar:
        description: "Hacer también la limpieza de vídeos ya publicados"
        type: boolean
        default: false

concurrency:
  group: videos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Limpieza mensual de vídeos ya publicados
        if: github.event.schedule == '0 3 1 * *' || inputs.limpiar
        run: python3 videos/limpiar.py

      - name: ¿Hay publicaciones sin vídeo?
        id: mirar
        run: python3 videos/pendientes.py

      - uses: actions/setup-python@v6
        if: steps.mirar.outputs.hay == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y la fuente Inter
        if: steps.mirar.outputs.hay == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-inter

      - name: Instalar librerías de Python
        if: steps.mirar.outputs.hay == 'true'
        run: pip install -r requirements.txt

      - name: Descargar la voz (Piper, es_ES davefx)
        if: steps.mirar.outputs.hay == 'true'
        run: |
          mkdir -p modelos && cd modelos
          curl -sSfL -o voz.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_ES-davefx-medium.tar.bz2
          echo "a3f6beb54a9cb893279f72978a22f807a4d9fc9c7848157b524d5cc7b7f58b22  voz.tar.bz2" | sha256sum -c -
          tar xjf voz.tar.bz2 && rm voz.tar.bz2

      - name: Crear los vídeos y subirlos a Airtable
        if: steps.mirar.outputs.hay == 'true'
        env:
          LIMITE: ${{ inputs.limite || '12' }}
        run: python videos/generar.py
